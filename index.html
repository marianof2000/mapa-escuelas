<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa de escuelas primarias de Dolores</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: #f4f6f8;
    }

    main {
      flex: 1;
      min-height: 0;
    }

    .map-frame {
      width: 100%;
      height: calc(100vh - 112px);
      min-height: 560px;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Mapa de escuelas primarias de Dolores</a>
    </div>
  </nav>

  <main>
    <iframe
      class="map-frame"
      src="maps-dol.html"
      title="Mapa interactivo de escuelas primarias de Dolores"
    ></iframe>
  </main>

  <footer class="py-3 text-center text-secondary bg-light">
    <small>Hecho con Folium, Leaflet y Bootstrap</small>
  </footer>
</body>
</html>
